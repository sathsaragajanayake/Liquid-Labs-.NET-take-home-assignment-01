name: .NET CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore LiquidLabsAssignment/LiquidLabsAssignment/LiquidLabsAssignment.csproj

      - name: Build API
        run: dotnet build LiquidLabsAssignment/LiquidLabsAssignment/LiquidLabsAssignment.csproj --no-restore

      - name: Run unit tests
        run: dotnet test LiquidLabsAssignment/LiquidLabsAssignment.Tests/LiquidLabsAssignment.Tests.csproj --no-restore