services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: liquidlabs-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LiquidLabs@12345"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LiquidLabs@12345' -C -Q 'SELECT 1' > /dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: liquidlabs-database-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./LiquidLabsAssignment/LiquidLabsAssignment/Database/schema.sql:/schema/schema.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver,1433 \
          -U sa \
          -P 'LiquidLabs@12345' \
          -C \
          -i /schema/schema.sql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liquidlabs-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LIQUIDLABSDB;User Id=sa;Password=LiquidLabs@12345;TrustServerCertificate=True;"
    depends_on:
      database-init:
        condition: service_completed_successfully

volumes:
  sqlserver-data: